<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2433"/><stop offset="1" stop-color="#2b3347"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a3f"/><stop offset="1" stop-color="#5e3b20"/></linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.15" r="0.9"><stop offset="0" stop-color="#ffe3a0" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ffcc70" stop-opacity="0.3"/><stop offset="1" stop-color="#ffcc70" stop-opacity="0"/></radialGradient>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6b55"/><stop offset="0.4" stop-color="#4c9a7c"/><stop offset="1" stop-color="#245546"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a7a4a"/><stop offset="0.4" stop-color="#e8d79a"/><stop offset="1" stop-color="#6b5d36"/></linearGradient>
<linearGradient id="page" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3dccd"/><stop offset="0.5" stop-color="#fffaf0"/><stop offset="1" stop-color="#ede6d6"/></linearGradient>
<linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4f7a"/><stop offset="1" stop-color="#17304f"/></linearGradient>
<linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b44a35"/><stop offset="0.35" stop-color="#e2705a"/><stop offset="1" stop-color="#8c3222"/></linearGradient>
<filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
