<path d="M285 395 Q282 420 290 440 L292 395Z" fill="#fff" opacity="0.5"/>
<rect x="505" y="392" width="95" height="16" rx="8" fill="#e6e9ec"/><rect x="505" y="392" width="95" height="5" rx="3" fill="#fff" opacity="0.6"/>
<rect x="282" y="372" width="12" height="9" rx="4" fill="#b9bdc2"/>
