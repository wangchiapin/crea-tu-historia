<rect x="700" y="100" width="42" height="50" rx="6" fill="#e9eef2" opacity="0.9"/><rect x="700" y="100" width="42" height="12" rx="4" fill="#8a6a45"/><rect x="706" y="120" width="30" height="24" fill="#b53a2a" opacity="0.8"/></g>
<rect x="0" y="0" width="800" height="600" fill="#2a1a0a" opacity="0.06"/>
