<path d="M360 340 C335 300 385 280 355 235 C340 205 372 190 360 160"/><path d="M410 340 C390 300 435 285 410 245 C395 215 420 200 410 170"/><path d="M455 340 C440 305 480 290 460 255"/>
</g>
