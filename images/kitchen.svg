<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e1d3"/><stop offset="1" stop-color="#cfc4b1"/></linearGradient>
<linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d8f93"/><stop offset="1" stop-color="#5d5f64"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8288"/><stop offset="0.2" stop-color="#e6e9ec"/><stop offset="0.5" stop-color="#b4b9bf"/><stop offset="0.8" stop-color="#eef0f2"/><stop offset="1" stop-color="#6e7379"/></linearGradient>
<linearGradient id="stove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2d31"/><stop offset="1" stop-color="#17181b"/></linearGradient>
<radialGradient id="soup" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#e8a23c"/><stop offset="1" stop-color="#b5651f"/></radialGradient>
<radialGradient id="flame" cx="0.5" cy="0.8" r="0.8"><stop offset="0" stop-color="#bfe3ff"/><stop offset="0.5" stop-color="#4a9bff"/><stop offset="1" stop-color="#2255d8" stop-opacity="0.2"/></radialGradient>
<radialGradient id="tom" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff6a55"/><stop offset="1" stop-color="#b3221a"/></radialGradient>
<linearGradient id="carrot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#d9601a"/></linearGradient>
<filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="tile" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#f4efe6"/><rect x="1.5" y="1.5" width="77" height="77" fill="#faf6ee" rx="3"/><rect x="0" y="0" width="80" height="80" fill="none" stroke="#cfc6b6" stroke-width="3"/></pattern>
</defs>
<rect width="800" height="600" fill="url(#wall)"/>
