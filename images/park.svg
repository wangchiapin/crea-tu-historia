<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb8e6"/><stop offset="1" stop-color="#d8ecf5"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa24a"/><stop offset="1" stop-color="#3f7a2f"/></linearGradient>
<linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c9a6"/><stop offset="1" stop-color="#b9a47c"/></linearGradient>
<radialGradient id="leaf" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="#8cc25a"/><stop offset="0.6" stop-color="#4f8f35"/><stop offset="1" stop-color="#2e6224"/></radialGradient>
<radialGradient id="leafFar" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#9ccb8d"/><stop offset="1" stop-color="#5f9a58"/></radialGradient>
<linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3322"/><stop offset="0.45" stop-color="#7a5a3d"/><stop offset="1" stop-color="#3b281a"/></linearGradient>
<linearGradient id="slat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58d55"/><stop offset="1" stop-color="#8d5d33"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
<filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
