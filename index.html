<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>造句小劇場</title>
<style>
:root{
  --bg:#e8e1d3; --panel:#f6f1e6; --ink:#1f1d1a; --mute:#6a6457; --line:#2a2722;
  --soft:#d9d0bd; --hint:#efe0b8; --ok:#3d5a3a; --warn:#8a3b24;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.hide{display:none!important}
/* 頂端列 */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:700;font-size:18px;letter-spacing:.06em;margin-right:auto}
.chip,.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:14px;line-height:1.2}
.btn:active,.chip:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip.on{background:var(--ink);color:var(--panel)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs .chip{padding:8px 16px;font-size:15px}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--panel)}
.pill.live{background:var(--ok);color:#fff;border-color:var(--ok)}
/* 首頁 */
.home{max-width:520px;margin:8vh auto 0;text-align:center}
.home h1{font-size:34px;letter-spacing:.1em;margin:0 0 6px}
.home p{color:var(--mute);margin:0 0 28px}
.home .btn{display:block;width:100%;padding:16px;font-size:18px;margin-bottom:12px}
.join{display:flex;gap:8px;margin-top:6px}
.join input{flex:1;font-size:26px;letter-spacing:.3em;text-align:center;border:1.5px solid var(--line);border-radius:6px;background:#fffdf7;padding:10px;min-width:0}
.err{color:var(--warn);min-height:22px;margin-top:8px;font-size:14px}
/* 卡片 */
.cards{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card .lab{font-size:12px;letter-spacing:.14em;color:var(--mute);padding:8px 12px 0}
.card.img img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-top:1.5px solid var(--line);margin-top:8px;background:var(--soft)}
.card.img .cap{padding:7px 12px;font-size:14px;border-top:1.5px solid var(--line)}
.card.gram{justify-content:center;min-height:200px}
.card.gram .body{padding:18px 16px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1}
.gtitle{font-size:clamp(26px,5.2vw,42px);font-weight:700;line-height:1.3;word-break:break-word;text-wrap:balance}
.gtag{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);font-size:18px;padding:40px 16px;text-align:center;line-height:1.8}
.card>.empty{flex:1;display:flex;align-items:center;justify-content:center;min-height:200px}
.stu{padding:10px 12px}.stu .row{gap:8px;align-items:center}.stu input{width:150px}
.errrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.errrow .tt{flex:1;font-weight:600}.errrow .n{color:var(--mute)}
.drawrow{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}
.draw{background:var(--ink);color:var(--panel);border:2px solid var(--ink);border-radius:8px;font-size:22px;letter-spacing:.3em;padding:14px 40px;font-weight:700}
.draw:active{transform:translateY(1px)}
.draw[disabled]{opacity:.5}
.rolling .gtitle,.rolling img{opacity:.75}
.note{font-size:13px;color:var(--mute)}
/* 老師專用區 */
.tonly{margin-top:14px;border:2px dashed #8a7a4a;background:var(--hint);border-radius:8px;padding:12px 14px}
.tonly h3{margin:0 0 8px;font-size:14px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.tonly h3 .btn{margin-left:auto}
.sug{font-size:clamp(20px,3.4vw,26px);line-height:1.6;font-weight:600;margin:4px 0 10px}
.sub{font-size:13px;color:var(--mute);margin:10px 0 3px}
.exl{margin:0;padding-left:18px;line-height:1.7}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words span{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:14px}
.thidden{margin-top:14px;border:1.5px dashed #8a7a4a;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.thidden .btn{margin-left:auto}
/* 設定 */
.sec{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.sec h2{font-size:16px;margin:0 0 8px;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec input[type=text],.sec textarea,.sec select{font:inherit;border:1.5px solid var(--line);border-radius:6px;background:#fffdf7;padding:8px 10px;min-width:0}
.sec textarea{width:100%;min-height:78px;resize:vertical;font-size:18px}
details.bk{border:1px solid var(--line);border-radius:6px;margin-top:8px;background:#fbf8f0}
details.bk>summary{padding:8px 10px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.plist{padding:4px 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 12px;max-height:380px;overflow:auto}
.plist .pi{display:flex;gap:6px;align-items:flex-start;padding:3px 0;font-size:14px;line-height:1.35;cursor:pointer}
.plist input{margin-top:3px}
.plist .pf{cursor:pointer;border-bottom:1px dotted var(--mute)}
.plist .pf:hover{background:#efe6cf}
.plist .id{color:var(--mute);font-size:11px;min-width:34px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.uimg{display:flex;gap:10px;border:1.5px solid var(--line);border-radius:6px;padding:8px;background:#fbf8f0}
.uimg img{width:96px;height:72px;object-fit:cover;border-radius:4px;flex:none}
.uimg .uf{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.uimg input[type=text]{width:100%;min-width:0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.imgs label{border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:#fbf8f0;cursor:pointer;font-size:13px}
.imgs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.imgs span{display:flex;gap:6px;align-items:center;padding:5px 8px}
.cust{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--soft)}
.cust .t{flex:1;min-width:0}
/* 計時 */
.timer{font-size:clamp(34px,8vw,64px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.06em;text-align:center;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 0;margin-top:12px}
.timer.low{background:var(--warn);color:#fff}
.timer.paused{opacity:.55}
.timer.done{animation:tmblink .6s ease-in-out 5}
@keyframes tmblink{50%{transform:scale(1.04);filter:brightness(1.25)}}
.tmpanel .row{align-items:center}
.tmpanel label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.story{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.story .lab{font-size:12px;letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
.story .s{font-size:clamp(24px,5vw,38px);font-weight:700;line-height:1.4}
.story .ask{margin-top:10px;color:var(--mute);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-size:14px;z-index:9;max-width:90vw}
.roombar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px;margin-bottom:12px}
.roombar .code{font-size:30px;font-weight:700;letter-spacing:.25em}
.roombar .grow{flex:1;min-width:140px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="content.js"></script>
<script>
/* ================= 基本工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LOCAL = /[?&]local=1/.test(location.search);   // 測試用：用同一個瀏覽器的分頁模擬連線
const LS_KEY = 'sd_settings_v1';

/* 介面文字：[繁體, 簡體] */

  fullLogin: ['授權老師登入', '授权老师登录'], fullOn: ['✓ 完整版', '✓ 完整版'], logout: ['登出', '登出'], offline: ['單機版', '单机版'],

  errMark: ['✗ 用錯了，記到常錯語法', '✗ 用错了，记到常错语法'], errDone: ['✓ 已記到', '✓ 已记到'], errUndo: ['（再按一次取消）', '（再按一次取消）'], pickStu: ['請先點選上方的學生姓名', '请先点选上方的学生姓名'],
  errEmpty: ['還沒有紀錄。抽選時按「用錯了」就會記在這裡。', '还没有记录。抽选时按「用错了」就会记在这里。'], errAgain: ['再抽它', '再抽它'], delStu: ['刪除學生', '删除学生'], errNote: ['紀錄只存在這台裝置的瀏覽器裡。', '记录只存在这台设备的浏览器里。'], errCnt: ['次', '次'],

  roomLabel: ['房號', '房号'], copyLink: ['複製學生連結', '复制学生链接'], copied: ['已複製', '已复制'],
  roomHelp: ['學生用手機打開同一個網址，輸入房號就能加入。', '学生用手机打开同一个网址，输入房号就能加入。'],
  creating: ['建立房間中…', '建立房间中…'],
  live: ['連線中', '连线中'],

  storyPh: ['例如：他終於找到鑰匙了。', '例如：他终于找到钥匙了。'],

  timerLab: ['倒數計時', '倒数计时'], timerOff: ['不計時', '不计时'], min: ['分鐘', '分钟'],
  timerStart: ['開始倒數', '开始倒数'], tmStart: ['開始', '开始'], tmPause: ['暫停', '暂停'], tmResume: ['繼續', '继续'], tmRestart: ['重來', '重来'], tmAuto: ['抽選後自動開始', '抽选后自动开始'], tmDown: ['倒數', '倒数'], tmUp: ['碼表（往上數）', '码表（往上数）'], secU: ['秒', '秒'], timerStop: ['停止', '停止'], timeUp: ['時間到！', '时间到！'],
  storyAid: ['故事提示：誰？在哪裡？發生什麼事？後來怎麼了？', '故事提示：谁？在哪里？发生什么事？后来怎么了？'],

  setOther: ['其他', '其他'], noRepeat: ['抽過的不再重複（抽完一輪再重來）', '抽过的不再重复（抽完一轮再重来）'],
  poolEmpty: ['抽選範圍是空的，請到「設定」選至少一冊或自訂語法點，並勾選圖片', '抽选范围是空的，请到“设置”选至少一册或自订语法点，并勾选图片'],
  book: ['第', '第'], bookUnit: ['冊', '册'], lesson: ['課', '课'], custom: ['自訂', '自订'],
  leave: ['離開', '离开'], back: ['回首頁', '回首页'],
  netOffer: ['連線功能需要網路', '连线功能需要网络'],
};
const SC = () => (S.lang === 'sc' ? 1 : 0);
const t = (k) => (T[k] ? T[k][SC()] : k);

/* ================= 設定（存在這台裝置） ================= */
const DEF = { lang: 'tc', books: [1], excluded: [], customs: [], imgsOff: [], showHints: true, storyTimer: 120, timerSel: 'd120', autoTimer: false, noRepeat: true, stus: [], stu: null, errs: {} };
function loadS() { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch (e) { return Object.assign({}, DEF); } }
let S = loadS();
function saveS() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

/* ================= 轉繁簡（自訂語法點／故事句子用） ================= */
let conv = { toTW: (x) => x, toCN: (x) => x };
function loadOpenCC() {
  const sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js';
  sc.onload = () => { try { conv.toTW = OpenCC.Converter({ from: 'cn', to: 'tw' }); conv.toCN = OpenCC.Converter({ from: 'tw', to: 'cn' }); } catch (e) {} };

  async close(code) { localStorage.removeItem('sd_room_' + code); },

const UMAX = 40;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('sd_user_imgs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('imgs', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction('imgs', mode); const st = tx.objectStore('imgs'); const q = fn(st); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
async function loadUserImgs() { try { UIMGS = ((await idbDo('readonly', (st) => st.getAll())) || []).sort((a, b) => a.t - b.t); } catch (e) { UIMGS = []; } }
function fileToJpeg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 800; c.height = 600; const x = c.getContext('2d');
      const k = Math.min(800 / im.naturalWidth, 600 / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;   // 完整放進 4:3，不裁切，多出來的空白用淡色補
      x.fillStyle = '#f1ede4'; x.fillRect(0, 0, 800, 600); x.drawImage(im, (800 - w) / 2, (600 - h) / 2, w, h);
      URL.revokeObjectURL(url);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 330000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      out.length > 330000 ? rej(new Error('big')) : res(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
    im.src = url;
  });
}
async function addUserImgs(files) {
  let n = 0;
  for (const f of files) {
    if (UIMGS.length >= UMAX) { toast(t('uMax')); break; }
    if (!/^image\//.test(f.type)) continue;
    try {
      const src = await fileToJpeg(f);
      const nm = both((f.name || '').replace(/\.[^.]+$/, '').slice(0, 20) || t('uDefName'));
      const rec = { id: 'u_' + Date.now().toString(36) + Math.floor(Math.random() * 99), src, name: nm, words: [], t: Date.now() };
      await idbDo('readwrite', (st) => st.put(rec)); UIMGS.push(rec); n++;
    } catch (e) { toast(t('uFail')); }
  }
  if (n) { toast(t('uOk') + ' ' + n); render(); }
}

/* ================= 倒數計時 ================= */
function tmNow() {
  if (!clock.k) return null;
  const el = clock.t0 ? (Date.now() - clock.t0) / 1000 : 0;
  return clock.k === 'd' ? Math.max(0, Math.ceil(clock.base - el - 1e-6)) : Math.floor(clock.base + el + 1e-6);
}
function startLocalClock() {
  if (clock.h) { clearInterval(clock.h); clock.h = null; }
  if (!clock.k || !clock.t0) return;
  if (clock.k === 'd' && tmNow() === 0) return;   // 已經時間到，不用再跑
  clock.h = setInterval(() => {
    const v = tmNow(); if (v == null) return;
    const up = clock.k === 'u', done = !up && v === 0;
    const box = $('#timerBox');
    if (box) { box.textContent = done ? t('timeUp') : fmtT(v); box.classList.toggle('low', !up && v <= 10); box.classList.toggle('done', done); }
    if (done) { clearInterval(clock.h); clock.h = null; if (role === 'teacher') render(); }
  }, 250);
}
// 把計時指令（tm）套到這台裝置的時鐘；tm 為 null 就清掉
function tmSet(tm) {
  if (clock.h) { clearInterval(clock.h); clock.h = null; }
  if (!tm) { clock.k = null; clock.t0 = 0; return; }
  clock.k = tm.k; clock.total = tm.total; clock.base = tm.v; clock.t0 = tm.run ? Date.now() : 0;
}

  };

const pick = (a) => a[Math.floor(Math.random() * a.length)];

function chooseNext(imgOnly, forceId) {
  const P = pool(), I = enabledImgs();
  if (forceId) {
    let p = G().points.find((x) => x.id === forceId);

    if (p && I.length) return { g: { id: p.id, tc: p.t, sc: p.ts, tagB: p.b, tagL: p.l, ex: p.ex || [] }, im: pick(I.length > 1 ? I.filter((i) => i.id !== lastImg) : I) };
  }
  if (!I.length || (!imgOnly && !P.length)) return null;
  if (imgOnly) { const ic0 = I.length > 1 ? I.filter((i) => i.id !== lastImg) : I; return { g: null, im: pick(ic0) }; }
  let cand = S.noRepeat ? P.filter((p) => !usedG.has(p.id)) : P;
  if (!cand.length) { usedG = new Set(); cand = P; }
  const g = pick(cand);
  let ic = I.length > 1 ? I.filter((i) => i.id !== lastImg) : I;
  const im = pick(ic);
  return { g, im };
}

// 計時指令：start（開始）、pause（暫停／繼續）、restart（重來）、stop（停止）。quiet=true 時不重畫、不上傳（呼叫的人自己會做）
function tmCmd(what, quiet) {
  const sel = S.timerSel || 'd120';
  const n = ((cur.tm && cur.tm.n) || 0) + 1;
  if (what === 'stop') { cur.tm = null; tmSet(null); }
  else if (what === 'pause') {
    if (!cur.tm) return;
    const v = tmNow();
    if (clock.t0) cur.tm = { k: cur.tm.k, total: cur.tm.total, v: v, run: false, n: n };
    else if (!(cur.tm.k === 'd' && v === 0)) cur.tm = { k: cur.tm.k, total: cur.tm.total, v: v, run: true, n: n };
    else return;
    tmSet(cur.tm);
  } else {
    // start / restart
    let k = null, total = 0;
    if (what === 'restart' && cur.tm) { k = cur.tm.k; total = cur.tm.total; }
    else if (sel === 'u') { k = 'u'; }
    else if (/^d\d+$/.test(sel)) { k = 'd'; total = +sel.slice(1); }
    if (!k) { if (!quiet) toast(t('timerOff')); return; }
    cur.tm = { k: k, total: total, v: k === 'd' ? total : 0, run: true, n: n };
    tmSet(cur.tm);
  }
  if (!quiet) { cur.seq++; render(); push(); }
}

    case 'ologin': { if (await ownerLogin()) render(); break; }
    case 'ologout': ownerLogout(); break;
    case 'openroom': openRoom(); break;
    case 'endroom': endRoom(); break;
    case 'copylink': try { await navigator.clipboard.writeText(el.dataset.url); toast(t('copied')); } catch (er) { prompt('', el.dataset.url); } break;
    case 'book': { const b = +v; S.books = S.books.includes(b) ? S.books.filter((x) => x !== b) : S.books.concat(b).sort(); saveS(); render(); break; }
    case 'stu': S.stu = S.stu === v ? null : v; saveS(); render(); break;

    case 'errdec': { const [sid, gid] = v.split('|'); const r = (S.errs[sid] || {})[gid]; if (r) errAdd(sid, { id: gid, tc: r.tc, sc: r.sc }, -1); render(); break; }
    case 'errdraw': { const [sid, gid] = v.split('|'); S.stu = sid; saveS(); tab = 'sentence'; drawSentence(false, gid); window.scrollTo({ top: 0 }); break; }
    case 'force': drawSentence(false, v); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'bookall': { const ids = G().points.filter((p) => p.b === +v).map((p) => p.id); S.excluded = S.excluded.filter((x) => !ids.includes(x)); saveS(); keepOpenRender(); break; }
    case 'booknone': { const ids = G().points.filter((p) => p.b === +v).map((p) => p.id); S.excluded = Array.from(new Set(S.excluded.concat(ids))); saveS(); keepOpenRender(); break; }
    case 'custadd': {
      const ti = ($('#cTitle').value || '').trim(), ex = ($('#cEx').value || '').trim();
      if (!ti) break;
      const T2 = both(ti), E2 = ex ? both(ex) : null;
      S.customs.push({ id: 'c' + Date.now(), tc: T2.tc, sc: T2.sc, ex: E2 ? E2.tc : '', exs: E2 ? E2.sc : '', on: true }); saveS(); keepOpenRender(); break;
    }
    case 'udel': { if (confirm(t('del') + '？')) { UIMGS = UIMGS.filter((i) => i.id !== v); S.imgsOff = S.imgsOff.filter((x) => x !== v); saveS(); await idbDo('readwrite', (st) => st.delete(v)); render(); } break; }
    case 'custdel': S.customs = S.customs.filter((c) => c.id !== v); saveS(); keepOpenRender(); break;
  }
});
function addStu() {
  const el = $('#stuIn'); const n = ((el && el.value) || '').trim(); if (!n) return;
  if (S.stus.some((x) => x.n === n)) { S.stu = S.stus.find((x) => x.n === n).id; }
  else { const id = 's' + Date.now(); S.stus.push({ id, n }); S.stu = id; }
  saveS(); render();
}
function keepOpenRender() {
  const open = Array.from(document.querySelectorAll('details.bk')).map((d) => d.open);
  const q = ($('#plSearch') || {}).value || '';
  render();
  document.querySelectorAll('details.bk').forEach((d, i) => { d.open = !!open[i]; });
  if ($('#plSearch')) { $('#plSearch').value = q; applyPlistFilter(); }
}
document.addEventListener('change', (e) => {
  if (e.target.id === 'uFile') { const fs = Array.from(e.target.files || []); e.target.value = ''; addUserImgs(fs); return; }
  const el = e.target; const a = el.dataset && el.dataset.a; if (!a) return;
  if (a === 'pt') { const id = el.dataset.v; S.excluded = el.checked ? S.excluded.filter((x) => x !== id) : S.excluded.concat(id); saveS(); updateRange(); }
  else if (a === 'custon') { const c = S.customs.find((x) => x.id === el.dataset.v); if (c) { c.on = el.checked; saveS(); updateRange(); } }
  else if (a === 'img') { const id = el.dataset.v; S.imgsOff = el.checked ? S.imgsOff.filter((x) => x !== id) : S.imgsOff.concat(id); saveS(); updateRange(); }
  else if (a === 'uname') { const r = UIMGS.find((i) => i.id === el.closest('.uimg').dataset.id); if (r) { r.name = both(el.value.trim().slice(0, 20) || t('uDefName')); idbDo('readwrite', (st) => st.put(r)); } }
  else if (a === 'uwords') { const r = UIMGS.find((i) => i.id === el.closest('.uimg').dataset.id); if (r) { r.words = el.value.split(/[、,，\s]+/).map((w) => w.trim()).filter(Boolean).slice(0, 12).map(both); idbDo('readwrite', (st) => st.put(r)); } }
  else if (a === 'norepeat') { S.noRepeat = el.checked; saveS(); }
  else if (a === 'timersel') { S.timerSel = el.value; saveS(); }
  else if (a === 'tmauto') { S.autoTimer = el.checked; saveS(); }
});
function updateRange() {
  document.querySelectorAll('details.bk').forEach((d) => { const boxes = d.querySelectorAll('.plist input'); const on = Array.from(boxes).filter((b) => b.checked).length; const n = d.querySelector('summary .note'); if (n) n.textContent = on + '/' + boxes.length; });
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'plSearch') applyPlistFilter();
  if (e.target.id === 'storyIn') storyDraft = e.target.value;
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'stuIn' && e.key === 'Enter') { addStu(); return; }
  if (e.target.id === 'joinIn' && e.key === 'Enter') { const c = e.target.value.trim(); if (/^\d{4}$/.test(c)) joinRoom(c); else $('#joinErr').textContent = t('badRoom'); return; }
  if (role === 'teacher' && tab === 'sentence' && (e.key === ' ' || e.key === 'Enter') && !/INPUT|TEXTAREA|SELECT|BUTTON|SUMMARY/.test(e.target.tagName)) { e.preventDefault(); drawSentence(); }
});
window.addEventListener('beforeunload', () => { if (room && !LOCAL) { /* 房間 6 小時後會自動過期 */ } });

loadOpenCC();
render();
</script>
</body>
